name: PR 189054 macOS app bundles for isolated live validation

on:
  push:
    branches: [proof/macos-app-189054]

permissions:
  contents: read

jobs:
  app-bundle:
    if: github.repository == 'tianhaotian/openclaw'
    name: Debug arm64 app (${{ matrix.variant }})
    runs-on: xcode-27
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: base
            commit: 95b5fa5fb78d1c39c0bd364ee3dc9f37a1750c1c
          - variant: fixed
            commit: 2cdbac7e61e8937cc15dd15d57291e1aa1007a16
    defaults:
      run:
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
    env:
      PROOF_VARIANT: ${{ matrix.variant }}
      PROOF_COMMIT: ${{ matrix.commit }}
      BUILD_CONFIG: debug
      BUILD_ARCHS: arm64
      BUNDLE_ID: ai.openclaw.mac.debug
      ALLOW_ADHOC_SIGNING: "1"
      SIGN_IDENTITY: "-"
      OPENCLAW_SKIP_MLX_TTS: "1"
    steps:
      - name: Check out the exact app source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.commit }}
          fetch-depth: 1
          persist-credentials: false

      - name: Select the CI toolchain and record clean source
        run: |
          test "$(git rev-parse HEAD)" = "$PROOF_COMMIT"
          test -z "$(git status --porcelain)"
          test "$(uname -m)" = arm64
          mkdir -p proof
          source scripts/lib/swift-toolchain.sh
          select_xcode_toolchain
          require_swift_toolchain
          {
            sw_vers
            xcodebuild -version
            swift --version
            uname -m
            git log -1 --format=fuller
            printf 'variant=%s\nconfiguration=%s\narchitectures=%s\nbundle_id=%s\n' \
              "$PROOF_VARIANT" "$BUILD_CONFIG" "$BUILD_ARCHS" "$BUNDLE_ID"
            printf 'signing=adhoc\nmlx_tts=omitted\n'
            df -h .
          } > proof/environment.txt
          shasum -a 256 apps/macos/Sources/OpenClaw/DashboardManager+Construction.swift \
            apps/macos/Sources/OpenClaw/DashboardWindowController.swift \
            scripts/package-mac-app.sh apps/macos/Package.resolved \
            pnpm-lock.yaml > proof/source-sha256.txt

      - name: Set up the source-pinned Node, pnpm and Bun toolchain
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.22.1"
          install-bun: "true"
          install-deps: "false"
          cache-mode: "off"

      - name: Package the complete debug app with the canonical script
        run: |
          {
            node --version
            pnpm --version
            bun --version
          } >> proof/environment.txt
          /bin/bash scripts/package-mac-app.sh > proof/package.log 2>&1 || {
            tail -100 proof/package.log
            exit 1
          }
          tail -30 proof/package.log

      - name: Verify bundle provenance and archive without losing symlinks
        run: |
          app=dist/OpenClaw.app
          test -x "$app/Contents/MacOS/OpenClaw"
          test -x "$app/Contents/MacOS/openclaw-mac"
          test -x "$app/Contents/Resources/cloudflared/arm64/cloudflared"
          test -x "$app/Contents/Resources/runtime/bin/bun"
          test "$(lipo -archs "$app/Contents/MacOS/OpenClaw")" = arm64
          codesign --verify --deep --strict "$app"
          codesign -dv --verbose=4 "$app" > proof/codesign.txt 2>&1
          grep -q '^Signature=adhoc$' proof/codesign.txt
          python3 - <<'PY'
          import json
          import os
          import plistlib
          from pathlib import Path

          app = Path("dist/OpenClaw.app")
          info = plistlib.loads((app / "Contents/Info.plist").read_bytes())
          source = json.loads(Path("dist/build-info.json").read_text())
          runtime = json.loads((app / "Contents/Resources/runtime/lib/node_modules/openclaw/dist/build-info.json").read_text())
          assert info["OpenClawGitCommit"] == os.environ["PROOF_COMMIT"]
          assert info["CFBundleIdentifier"] == "ai.openclaw.mac.debug"
          assert source["commit"] == os.environ["PROOF_COMMIT"]
          assert info["OpenClawRuntimeBuildID"] == source["buildId"]
          assert info["OpenClawBuildTimestamp"] == source["builtAt"]
          for key in ("version", "commit", "builtAt", "buildId"):
              assert source[key] == runtime[key], key
          assert source["buildId"]
          assert not (app / "Contents/MacOS/openclaw-mlx-tts").exists()
          Path("proof/provenance.json").write_text(json.dumps({
              "variant": os.environ["PROOF_VARIANT"],
              "commit": os.environ["PROOF_COMMIT"],
              "configuration": "debug",
              "architecture": "arm64",
              "signing": "adhoc",
              "mlxTts": "omitted",
              "minimumSystemVersion": info["LSMinimumSystemVersion"],
              "runtimeBuild": runtime,
              "liveAuthenticationValidated": False,
          }, indent=2) + "\n")
          PY
          cp "$app/Contents/Info.plist" proof/Info.plist
          cp "$app/Contents/Resources/cloudflared/manifest.json" proof/cloudflared-manifest.json
          cp dist/build-info.json proof/build-info.json
          archive="OpenClaw-pr-189054-${PROOF_VARIANT}-arm64-debug.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "proof/$archive"
          cd proof
          shasum -a 256 "$archive" > SHA256SUMS

      - name: Record final source and disk state
        if: always()
        run: |
          mkdir -p proof
          git status --short > proof/final-git-status.txt
          git diff --binary > proof/final-source.diff
          df -h . > proof/final-disk.txt

      - name: Upload app and build evidence for disposable macOS validation
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: macos-app-189054-${{ matrix.variant }}-${{ github.run_id }}
          path: proof/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
